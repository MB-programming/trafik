<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>سكانر الأسعار - ترافيك</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger:  #dc2626;
      --warning: #d97706;
      --bg:      #0f172a;
      --card:    #1e293b;
      --border:  #334155;
      --text:    #f1f5f9;
      --muted:   #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header a {
      color: var(--muted);
      text-decoration: none;
      font-size: 1.4rem;
      line-height: 1;
    }
    header h1 { font-size: 1.1rem; }

    /* Camera viewport */
    .camera-wrap {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      flex: 1;
      background: #000;
      overflow: hidden;
    }
    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Scan line animation */
    .scan-line {
      position: absolute;
      left: 10%;
      right: 10%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22d3ee, transparent);
      border-radius: 2px;
      animation: scan 2s ease-in-out infinite;
      box-shadow: 0 0 12px #22d3ee88;
    }
    @keyframes scan {
      0%   { top: 20%; }
      50%  { top: 78%; }
      100% { top: 20%; }
    }

    /* Viewfinder corners */
    .viewfinder {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: #22d3ee;
      border-style: solid;
    }
    .corner.tl { top: 18%; left: 8%;  border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .corner.tr { top: 18%; right: 8%; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .corner.bl { bottom: 18%; left: 8%;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .corner.br { bottom: 18%; right: 8%; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

    /* Canvas hidden — used for frame capture */
    #canvas { display: none; }

    /* Result area */
    .result-panel {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 20px 18px;
      min-height: 160px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .result-idle   { color: var(--muted); font-size: 1rem; }
    .result-found  { }
    .result-notfound { color: var(--warning); }

    .price-badge {
      font-size: 2.8rem;
      font-weight: 900;
      color: #4ade80;
      line-height: 1;
    }
    .product-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text);
    }
    .barcode-label {
      font-size: .85rem;
      color: var(--muted);
      font-family: monospace;
      margin-top: 4px;
    }
    .currency { font-size: 1.4rem; color: #4ade80; font-weight: 700; }

    .pulse {
      animation: pop .3s ease;
    }
    @keyframes pop {
      0%   { transform: scale(.8); opacity:.4; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity:1; }
    }

    /* Manual barcode input */
    .manual-bar {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      gap: 8px;
    }
    .manual-bar input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .manual-bar input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .btn-lookup {
      padding: 10px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: .95rem;
    }
    .btn-lookup:hover { background: #1d4ed8; }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      background: var(--muted);
      margin-left: 6px;
    }
    .status-dot.scanning { background: #22d3ee; animation: blink 1s infinite; }
    .status-dot.found    { background: #4ade80; }
    @keyframes blink { 50% { opacity: .3; } }

    .cam-status {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,.55);
      color: #e2e8f0;
      font-size: .78rem;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

<header>
  <a href="/" title="رجوع">←</a>
  <h1>📷 سكانر الأسعار</h1>
  <span class="status-dot" id="statusDot"></span>
</header>

<div class="camera-wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="viewfinder">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line" id="scanLine"></div>
  </div>
  <div class="cam-status" id="camStatus">جارٍ التحميل...</div>
</div>

<div class="result-panel" id="resultPanel">
  <p class="result-idle" id="resultMsg">وجّه الكاميرا على باركود المنتج</p>
</div>

<div class="manual-bar">
  <input type="text" id="manualInput" placeholder="أو أدخل الباركود يدويًا..."
         inputmode="numeric" />
  <button class="btn-lookup" onclick="manualLookup()">بحث</button>
</div>

<!-- ZXing barcode scanner (MIT) -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<script>
  const video      = document.getElementById("video");
  const canvas     = document.getElementById("canvas");
  const statusDot  = document.getElementById("statusDot");
  const camStatus  = document.getElementById("camStatus");
  const resultPanel= document.getElementById("resultPanel");
  const scanLine   = document.getElementById("scanLine");

  let lastBarcode  = null;
  let cooldown     = false;

  // ── Lookup ──────────────────────────────────────────────────────────────────
  async function lookup(barcode) {
    if (cooldown || barcode === lastBarcode) return;
    cooldown = true;
    lastBarcode = barcode;

    const res  = await fetch(`/api/lookup?barcode=${encodeURIComponent(barcode)}`);
    const data = await res.json();
    showResult(data);

    setTimeout(() => { cooldown = false; }, 3000);
  }

  function showResult(data) {
    resultPanel.classList.add("pulse");
    resultPanel.addEventListener("animationend", () => resultPanel.classList.remove("pulse"), { once: true });

    if (data.found) {
      statusDot.className = "status-dot found";
      resultPanel.innerHTML = `
        <div class="product-name">${escHtml(data.name)}</div>
        <div>
          <span class="price-badge">${parseFloat(data.price).toFixed(2)}</span>
          <span class="currency"> ج</span>
        </div>
        <div class="barcode-label">🔍 ${escHtml(data.barcode)}</div>
      `;
    } else {
      statusDot.className = "status-dot";
      resultPanel.innerHTML = `
        <p class="result-notfound">⚠️ الباركود غير موجود في القاعدة</p>
        <p class="barcode-label">${escHtml(data.barcode || "")}</p>
        <p style="font-size:.85rem;color:var(--muted);margin-top:8px">
          <a href="/" style="color:#60a5fa">أضفه من هنا ←</a>
        </p>
      `;
    }
  }

  function escHtml(str) {
    return String(str).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  // ── Manual input ─────────────────────────────────────────────────────────
  function manualLookup() {
    const val = document.getElementById("manualInput").value.trim();
    if (!val) return;
    lastBarcode = null;
    lookup(val);
  }
  document.getElementById("manualInput").addEventListener("keydown", e => {
    if (e.key === "Enter") manualLookup();
  });

  // ── Camera + ZXing ────────────────────────────────────────────────────────
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }
      });
      video.srcObject = stream;
      camStatus.textContent = "الكاميرا شغالة";
      statusDot.className = "status-dot scanning";
      startDecoder();
    } catch (err) {
      camStatus.textContent = "تعذّر فتح الكاميرا";
      resultPanel.innerHTML = `<p class="result-notfound">⚠️ الرجاء السماح بالوصول للكاميرا</p>
        <p class="result-idle" style="margin-top:8px">أو استخدم حقل الإدخال اليدوي بالأسفل</p>`;
    }
  }

  function startDecoder() {
    const hints = new Map();
    const formats = [
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.UPC_A,
      ZXing.BarcodeFormat.UPC_E,
      ZXing.BarcodeFormat.ITF,
      ZXing.BarcodeFormat.DATA_MATRIX,
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    const reader = new ZXing.BrowserMultiFormatReader(hints);
    const ctx    = canvas.getContext("2d");

    function tick() {
      if (video.readyState < 2) { requestAnimationFrame(tick); return; }
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      try {
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const luminance = new ZXing.RGBLuminanceSource(imgData.data, canvas.width, canvas.height);
        const bitmap    = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminance));
        const result    = reader.decodeBitmap(bitmap);
        if (result) lookup(result.getText());
      } catch (_) {}

      requestAnimationFrame(tick);
    }
    video.addEventListener("loadedmetadata", () => requestAnimationFrame(tick));
  }

  startCamera();
</script>
</body>
</html>
