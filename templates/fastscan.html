<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fast Scan - ترافيك</title>
  <style>
    :root {
      --cat-food:  #16a34a;
      --cat-cig:   #b45309;
      --cat-drink: #2563eb;
      --cat-misc:  #7c3aed;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      overflow: hidden;
    }

    /* ─── Full-screen camera ─── */
    #video {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ─── Top bar (header) ─── */
    #topBar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: env(safe-area-inset-top, 10px) 14px 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,.75) 0%, transparent 100%);
    }
    #topBar a {
      color: #fff;
      text-decoration: none;
      font-size: 1.3rem;
      line-height: 1;
      padding: 6px;
    }
    #topBar h1 {
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      flex: 1;
      text-shadow: 0 1px 4px rgba(0,0,0,.6);
    }
    #scanToggle {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.35);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
    }
    #scanToggle.running { background: rgba(34,197,94,.25); border-color: rgba(34,197,94,.5); }

    /* ─── Scanning ring (center) ─── */
    #scanRing {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      width: 200px; height: 200px;
      border: 3px solid rgba(34,211,238,.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
      transition: opacity .3s;
    }
    #scanRing.pulsing {
      animation: ringPulse 1.5s ease-in-out infinite;
    }
    #scanRing.found {
      border-color: #4ade80;
      box-shadow: 0 0 0 4px rgba(74,222,128,.25);
      animation: none;
    }
    @keyframes ringPulse {
      0%,100% { opacity:.6; transform:translate(-50%,-55%) scale(1); }
      50%      { opacity:1;  transform:translate(-50%,-55%) scale(1.06); }
    }

    /* corner lines inside ring */
    #scanRing::before, #scanRing::after {
      content:"";
      position:absolute;
      background:#22d3ee;
    }
    #scanRing::before { top:50%; left:50%; width:1px; height:30%; transform:translate(-50%,-100%); }
    #scanRing::after  { top:50%; left:50%; width:30%; height:1px; transform:translate(-100%,-50%); }

    /* ─── Progress bar ─── */
    #progressBar {
      position: fixed;
      bottom: 0; left: 0;
      height: 3px;
      background: #22d3ee;
      width: 0%;
      z-index: 10;
      transition: width linear;
    }

    /* ─── Result overlay ─── */
    #resultOverlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 20;
      padding: 0 0 env(safe-area-inset-bottom, 0);
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.22,1,.36,1);
    }
    #resultOverlay.visible { transform: translateY(0); }

    .result-card {
      margin: 0 12px 12px;
      border-radius: 18px;
      padding: 18px 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }
    .result-card.found-card {
      background: rgba(15,23,42,.88);
      border: 1px solid rgba(74,222,128,.35);
    }
    .result-card.notfound-card {
      background: rgba(15,23,42,.88);
      border: 1px solid rgba(217,119,6,.4);
    }

    .rc-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .rc-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      line-height: 1.3;
      flex: 1;
    }
    .rc-price {
      font-size: 2.2rem;
      font-weight: 900;
      color: #4ade80;
      line-height: 1;
      white-space: nowrap;
    }
    .rc-currency { font-size: 1rem; color: #4ade80; }

    .rc-bottom {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .cat-pill {
      padding: 3px 12px;
      border-radius: 12px;
      font-size: .8rem;
      font-weight: 700;
    }
    .cat-غذائية  { background:rgba(22,163,74,.25);  color:#86efac; border:1px solid rgba(22,163,74,.4); }
    .cat-سجاير   { background:rgba(180,83,9,.25);   color:#fcd34d; border:1px solid rgba(180,83,9,.4); }
    .cat-مشروبات { background:rgba(37,99,235,.25);  color:#93c5fd; border:1px solid rgba(37,99,235,.4); }
    .cat-منوعات  { background:rgba(124,58,237,.25); color:#c4b5fd; border:1px solid rgba(124,58,237,.4); }

    .rc-identified { font-size: .78rem; color: #64748b; }

    .rc-notfound { color: #fbbf24; font-size: 1rem; font-weight: 600; }
    .rc-notfound-sub { color: #64748b; font-size: .82rem; margin-top: 6px; }
    .rc-notfound-sub a { color: #60a5fa; }

    /* ─── Scanning status label ─── */
    #statusLabel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 60px);
      color: rgba(255,255,255,.8);
      font-size: .82rem;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
      z-index: 5;
      pointer-events: none;
      transition: opacity .3s;
    }

    /* ─── No API key notice ─── */
    #noKeyNotice {
      position: fixed;
      top: 70px; left: 14px; right: 14px;
      background: rgba(220,38,38,.85);
      color: #fff;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: .88rem;
      z-index: 30;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    #noKeyNotice a { color:#fde68a; }

    canvas { display: none; }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<!-- Top bar -->
<div id="topBar">
  <a href="/">←</a>
  <h1>⚡ Fast Scan</h1>
  <button id="scanToggle" onclick="toggleScan()">إيقاف</button>
</div>

<!-- Center scan ring -->
<div id="scanRing" class="pulsing"></div>
<div id="statusLabel">جارٍ المسح...</div>

<!-- Progress bar -->
<div id="progressBar"></div>

<!-- Result overlay -->
<div id="resultOverlay">
  <div class="result-card found-card" id="resultCard">
    <!-- filled by JS -->
  </div>
</div>

{% if not has_key %}
<div id="noKeyNotice">
  ⚠️ مفتاح <code>ANTHROPIC_API_KEY</code> غير مضبوط — التعرف على الصور لن يعمل.
  <br/><a href="/">اضبطه في ملف <code>.env</code> ثم أعد التشغيل</a>
</div>
{% endif %}

<script>
  const video         = document.getElementById("video");
  const canvas        = document.getElementById("canvas");
  const scanRing      = document.getElementById("scanRing");
  const statusLabel   = document.getElementById("statusLabel");
  const resultOverlay = document.getElementById("resultOverlay");
  const resultCard    = document.getElementById("resultCard");
  const progressBar   = document.getElementById("progressBar");
  const scanToggle    = document.getElementById("scanToggle");

  const SCAN_INTERVAL = 3000; // ms between scans
  let scanning  = true;
  let timer     = null;
  let pbTimer   = null;

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s||"").replace(/[&<>"']/g,c=>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function showFound(data) {
    scanRing.className = "found";
    statusLabel.style.opacity = "0";
    resultCard.className = "result-card found-card";
    resultCard.innerHTML = `
      <div class="rc-top">
        <div class="rc-name">${esc(data.name)}</div>
        <div>
          <span class="rc-price">${parseFloat(data.price).toFixed(2)}</span>
          <span class="rc-currency"> ج</span>
        </div>
      </div>
      <div class="rc-bottom">
        <span class="cat-pill cat-${esc(data.category)}">${esc(data.category)}</span>
        ${data.identified_as ? `<span class="rc-identified">AI: ${esc(data.identified_as)}</span>` : ""}
      </div>
    `;
    resultOverlay.classList.add("visible");
  }

  function showNotFound(data) {
    scanRing.className = "pulsing";
    statusLabel.style.opacity = "1";
    statusLabel.textContent = "لم يُعثر على المنتج";
    resultCard.className = "result-card notfound-card";
    resultCard.innerHTML = `
      <div class="rc-notfound">⚠️ المنتج غير موجود في القاعدة</div>
      ${data.identified_as ? `<div class="rc-notfound-sub">AI قال: ${esc(data.identified_as)}</div>` : ""}
      <div class="rc-notfound-sub"><a href="/">أضفه هنا ←</a></div>
    `;
    resultOverlay.classList.add("visible");
    setTimeout(() => {
      resultOverlay.classList.remove("visible");
      scanRing.className = "pulsing";
      statusLabel.textContent = "جارٍ المسح...";
      statusLabel.style.opacity = "1";
    }, 3000);
  }

  // ── Progress bar animation ───────────────────────────────────────────────
  function startProgressBar(duration) {
    progressBar.style.transition = "none";
    progressBar.style.width = "0%";
    void progressBar.offsetWidth;
    progressBar.style.transition = `width ${duration}ms linear`;
    progressBar.style.width = "100%";
  }

  // ── Capture + identify ────────────────────────────────────────────────────
  async function scanFrame() {
    if (!scanning || video.readyState < 2) return;

    statusLabel.textContent = "⏳ جارٍ التعرف...";
    statusLabel.style.opacity = "1";
    scanRing.className = "pulsing";

    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const b64 = canvas.toDataURL("image/jpeg", 0.75).split(",")[1];

    try {
      const res  = await fetch("/api/identify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: b64 }),
      });
      const data = await res.json();

      if (data.error === "no_api_key") {
        statusLabel.textContent = "مفتاح API غير مضبوط";
        return;
      }

      if (data.found) {
        showFound(data);
      } else {
        showNotFound(data);
      }
    } catch(e) {
      statusLabel.textContent = "خطأ في الاتصال";
    }
  }

  function scheduleNext() {
    if (!scanning) return;
    startProgressBar(SCAN_INTERVAL);
    timer = setTimeout(async () => {
      await scanFrame();
      scheduleNext();
    }, SCAN_INTERVAL);
  }

  // ── Toggle scan ──────────────────────────────────────────────────────────
  function toggleScan() {
    scanning = !scanning;
    if (scanning) {
      scanToggle.textContent = "إيقاف";
      scanToggle.classList.add("running");
      scanRing.className = "pulsing";
      statusLabel.style.opacity = "1";
      statusLabel.textContent = "جارٍ المسح...";
      resultOverlay.classList.remove("visible");
      scheduleNext();
    } else {
      clearTimeout(timer);
      scanToggle.textContent = "تشغيل";
      scanToggle.classList.remove("running");
      scanRing.style.animation = "none";
      statusLabel.textContent = "متوقف";
      progressBar.style.width = "0%";
    }
  }

  // ── Camera start ──────────────────────────────────────────────────────────
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } },
      });
      video.srcObject = stream;
      video.addEventListener("loadedmetadata", () => {
        scanToggle.classList.add("running");
        scheduleNext();
      });
    } catch (e) {
      statusLabel.textContent = "تعذّر فتح الكاميرا";
      scanRing.style.display = "none";
    }
  }

  startCamera();
</script>
</body>
</html>
